<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" role="img" aria-labelledby="title desc">
  <title id="title">Deployment  Docker Compose</title>
  <desc id="desc">Target Compose services: web, api, worker, postgres, rabbitmq.</desc>
  <rect width="860" height="420" fill="#f7f7f4"/>
  <text x="24" y="36" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1a1a1a">Deployment  Docker Compose (target)</text>

  <rect x="40" y="70" width="780" height="310" rx="12" fill="#fff" stroke="#666" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="56" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#444">host: docker compose network home-library</text>

  <rect x="70" y="130" width="130" height="70" rx="8" fill="#dce8f5" stroke="#2f5d8a" stroke-width="2"/>
  <text x="135" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">web</text>
  <text x="135" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334">:4200 ’ 80</text>

  <rect x="230" y="130" width="130" height="70" rx="8" fill="#e8f0e4" stroke="#3d6b3d" stroke-width="2"/>
  <text x="295" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">api</text>
  <text x="295" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334">:8080</text>

  <rect x="390" y="130" width="130" height="70" rx="8" fill="#e8f0e4" stroke="#3d6b3d" stroke-width="2"/>
  <text x="455" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">worker</text>
  <text x="455" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334">no public port</text>

  <rect x="550" y="130" width="130" height="70" rx="8" fill="#f5ecd9" stroke="#8a6a2f" stroke-width="2"/>
  <text x="615" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">postgres</text>
  <text x="615" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334">:5432</text>

  <rect x="710" y="130" width="90" height="70" rx="8" fill="#f5ecd9" stroke="#8a6a2f" stroke-width="2"/>
  <text x="755" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">rabbitmq</text>
  <text x="755" y="180" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#334">5672 / 15672</text>

  <text x="70" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#333">Single command (once app services are enabled):</text>
  <rect x="70" y="275" width="420" height="40" rx="6" fill="#222" />
  <text x="86" y="301" font-family="Consolas, monospace" font-size="14" fill="#d8f5d0">docker compose up -d --build</text>

  <text x="70" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#555">Infra services (postgres, rabbitmq) are available now; api/worker/web are target for later PRs.</text>
</svg>
